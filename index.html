
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoiceSaathi Practice</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#07152b,#123c49);
 color:white;min-height:100vh
}
.container{
 max-width:650px;margin:20px auto;
 padding:24px;background:#10263b;
 border:1px solid #31566b;border-radius:20px
}
h1{text-align:center;color:#53e5b2}
.subtitle{text-align:center;color:#b9ccdc}
select{
 width:100%;padding:14px;margin:12px 0;
 background:#071b2d;color:white;
 border:1px solid #45657b;border-radius:10px;
 font-size:16px
}
button{
 cursor:pointer;border:0;border-radius:10px;
 padding:14px;font-size:15px;font-weight:bold
}
.primary{
 width:100%;background:#13a982;color:white;
 margin-top:12px
}
.secondary{
 background:#1764e8;color:white;width:100%;margin-top:12px
}
.option{
 display:block;width:100%;text-align:left;
 background:#17374b;color:white;
 border:1px solid #45657b;margin:10px 0
}
.option:disabled{cursor:default;opacity:1}
.option.correct{background:#176b49;border-color:#53e5b2}
.option.wrong{background:#853e43;border-color:#ef7777}
.card{
 background:#071b2d;border-radius:13px;
 padding:18px;margin-top:18px
}
#question{font-size:19px;line-height:1.6}
#feedback{color:#53e5b2;line-height:1.6}
#progress{color:#a9c9d5;font-size:13px}
#score{font-size:23px;color:#53e5b2;text-align:center}
.hidden{display:none}
</style>
</head>

<body>
<div class="container">

<h1>🎓 VoiceSaathi Practice</h1>
<p class="subtitle">Learn • Practice • Improve</p>

<label for="subject">Choose your subject</label>
<select id="subject">
<option value="english">English</option>
<option value="tamil">Tamil</option>
<option value="physics">Engineering Physics</option>
<option value="chemistry">Environmental Chemistry</option>
<option value="maths">Matrices and Calculus</option>
</select>

<div class="card">
 <p id="progress">Ready to begin</p>
 <p id="question">Select a subject and press Start Quiz.</p>
 <div id="options"></div>
 <p id="feedback"></p>
 <p id="score"></p>
</div>

<button class="primary" id="start">▶ Start Quiz</button>
<button class="secondary" id="next">Next Question →</button>

</div>

<script>

const $ = id => document.getElementById(id);

// Question format:
// q = question, o = options, a = correct option index.

const quizzes = {

english:[
{q:"Which is a noun?",o:["Run","Teacher","Quickly","Beautiful"],a:1},
{q:"Choose the correct plural of 'child'.",o:["Childs","Childes","Children","Childrens"],a:2},
{q:"Which is a verb?",o:["Beautiful","Running","Blue","Tall"],a:1},
{q:"What is the opposite of 'ancient'?",o:["Old","Modern","Historic","Past"],a:1},
{q:"Choose the correct article: ___ apple.",o:["A","An","The only","No article"],a:1}
],

tamil:[
{q:"தமிழ் மொழியின் முதல் இலக்கண நூல் எது?",o:["திருக்குறள்","தொல்காப்பியம்","சிலப்பதிகாரம்","மணிமேகலை"],a:1},
{q:"திருக்குறளை இயற்றியவர் யார்?",o:["கம்பர்","இளங்கோவடிகள்","திருவள்ளுவர்","அவ்வையார்"],a:2},
{q:"தமிழில் உயிரெழுத்துகள் எத்தனை?",o:["10","12","18","216"],a:1},
{q:"தமிழில் மெய்யெழுத்துகள் எத்தனை?",o:["12","18","30","247"],a:1},
{q:"சிலப்பதிகாரத்தின் ஆசிரியர் யார்?",o:["சீத்தலைச் சாத்தனார்","இளங்கோவடிகள்","கம்பர்","திருவள்ளுவர்"],a:1}
],

physics:[
{q:"What is the SI unit of force?",o:["Joule","Newton","Watt","Pascal"],a:1},
{q:"Which law is represented by F = ma?",o:["Newton's first law","Newton's second law","Newton's third law","Law of gravitation"],a:1},
{q:"What is the SI unit of energy?",o:["Newton","Watt","Joule","Volt"],a:2},
{q:"Which property measures resistance to deformation?",o:["Elasticity","Density","Velocity","Pressure"],a:0},
{q:"What is the SI unit of frequency?",o:["Metre","Hertz","Joule","Newton"],a:1}
],

chemistry:[
{q:"What is the chemical formula of water?",o:["CO2","H2O","O2","NaCl"],a:1},
{q:"What does the 5R concept promote?",o:["Waste generation","Sustainable waste management","More pollution","Single-use products"],a:1},
{q:"What is biochar commonly produced from?",o:["Biomass","Metal","Glass","Sand"],a:0},
{q:"What is the pH of a neutral solution at 25°C?",o:["2","5","7","12"],a:2},
{q:"Which is an example of biodegradable material?",o:["Plastic bottle","Vegetable waste","Aluminium can","Glass"],a:1}
],

maths:[
{q:"What is the determinant of [[1,0],[0,1]]?",o:["0","1","2","-1"],a:1},
{q:"What is the derivative of x²?",o:["x","2x","x²","2"],a:1},
{q:"What is the integral of 1 dx?",o:["1","x + C","0","x²"],a:1},
{q:"What is the identity matrix?",o:["A matrix with all zeros","A matrix with diagonal ones and other entries zero","A matrix with all ones","A rectangular matrix"],a:1},
{q:"What is the derivative of sin x?",o:["cos x","-cos x","tan x","-sin x"],a:0}
]

};

let questions=[];
let index=0;
let marks=0;
let answered=false;
let running=false;

function startQuiz(){

 const subject=$("subject").value;
 questions=quizzes[subject];
 index=0;
 marks=0;
 answered=false;
 running=true;

 $("score").textContent="";
 $("start").textContent="Restart Quiz";

 showQuestion();

}

function showQuestion(){

 const q=questions[index];

 $("progress").textContent=
 "Question "+(index+1)+" of "+questions.length;

 $("question").textContent=q.q;
 $("options").innerHTML="";
 $("feedback").textContent="";
 $("next").textContent=
 index===questions.length-1?"Finish Quiz":"Next Question →";

 answered=false;

 q.o.forEach((option,i)=>{

  const btn=document.createElement("button");
  btn.className="option";
  btn.textContent=String.fromCharCode(65+i)+". "+option;

  btn.onclick=()=>selectAnswer(i);

  $("options").appendChild(btn);

 });

}

function selectAnswer(choice){

 if(answered||!running)return;

 answered=true;

 const q=questions[index];
 const buttons=$("options").querySelectorAll("button");

 buttons.forEach((btn,i)=>{

  btn.disabled=true;

  if(i===q.a)btn.classList.add("correct");

  if(i===choice&&choice!==q.a)
    btn.classList.add("wrong");

 });

 if(choice===q.a){

  marks++;

  $("feedback").textContent="✅ Correct! Excellent work!";

 }else{

  $("feedback").textContent=
   "❌ Incorrect. Correct answer: "+q.o[q.a];

 }

}

function nextQuestion(){

 if(!running){

  $("feedback").textContent="Press Start Quiz first.";
  return;

 }

 if(!answered){

  $("feedback").textContent="Please select an answer first.";
  return;

 }

 index++;

 if(index>=questions.length){

  finishQuiz();
  return;

 }

 showQuestion();

}

function finishQuiz(){

 running=false;

 $("progress").textContent="Quiz completed!";

 $("question").textContent="Congratulations! 🎉";

 $("options").innerHTML="";

 $("feedback").textContent="You have completed your practice.";

 $("score").textContent=
 "Your Score: "+marks+" / "+questions.length;

 $("next").textContent="Quiz Completed";

 $("start").textContent="Start Again";

}

$("start").addEventListener("click",startQuiz);
$("next").addEventListener("click",nextQuestion);

$("subject").addEventListener("change",()=>{

 running=false;

 $("progress").textContent="Subject changed";

 $("question").textContent=
 "Press Start Quiz to begin your new subject.";

 $("options").innerHTML="";
 $("feedback").textContent="";
 $("score").textContent="";
 $("start").textContent="▶ Start Quiz";

});

</script>
</body>
</html>
